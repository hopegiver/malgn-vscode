# 가벼운 push/PR 상시 CI — 프런트엔드(타입체크+빌드)만 검사한다.
#
# 왜 Rust 쪽을 여기서 검사하지 않는가:
#   - Tauri는 Linux 타깃에서 webkit2gtk 시스템 라이브러리가 필요해 ubuntu-latest에서
#     `cargo check`를 돌리려면 apt 패키지 설치가 추가로 필요하다. 이 프로젝트의 배포
#     타깃은 macOS/Windows뿐이라(Linux 미지원) 그 비용을 들여 검사할 대상이 없다.
#   - macOS/Windows 러너로 Rust를 매 push마다 컴파일하면 비용이 크다(GitHub 호스티드
#     macOS 분당 과금이 Linux의 약 10배). Rust 컴파일 검증은 수동 트리거인
#     `tauri-portable-build.yml`(실제 빌드가 곧 검증)에 맡긴다.
#
# 보안 원칙(기존 워크플로에서 계승):
#   - 액션은 sha로 고정한다(가변 태그 `@v4` 금지).
#   - `permissions`는 최소(`contents: read`)로 둔다.
#   - 시크릿을 쓰지 않는다.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Frontend build (vite)
        run: pnpm build
