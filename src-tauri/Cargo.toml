[package]
name = "tauri-app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# BatBadBut(CVE-2024-24576) 완화가 1.77.2, 후속(CVE-2024-43402)이 1.81.0에서
# 각각 들어갔다 — Windows에서 npm/pnpm/wrangler의 `.cmd` 전역 shim을
# `std::process::Command`로 직접 실행하는 것(dev_tools 설계 §D.4)이 안전하려면
# 이 completion을 컴파일러가 강제해야 한다. 이 값을 낮추면 그 전제가 깨진다.
# (기존 BatBadBut 주석은 그대로 두고 값만 올린다 — 1.85는 1.77.2/1.81 완화를
# 모두 포함하므로 위 전제는 깨지지 않는다.) 추가 사유: cron-parser 0.11이
# edition 2024라 컴파일러 1.85 이상을 요구한다.
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify-debouncer-mini = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# RUSTSEC/CVE-2026-25537(type confusion, exp/nbf) 대응으로 9→10 메이저 업그레이드.
# 10부터 crypto 백엔드를 features로 명시 선택해야 한다(aws_lc_rs | rust_crypto).
# 이 저장소는 reqwest도 native-tls 대신 rustls-tls를 쓰는 순수-Rust 스택 방침이라
# cmake/nasm 등 외부 C 툴체인이 필요 없는 rust_crypto를 택했다(맥/윈도우 교차
# 빌드 안정성). RS256 검증(공개키만 사용)이라 rsa crate의 Marvin Attack(개인키
# 복호화 타이밍 사이드채널)과는 무관하지만, 참고용으로 0.9.6(패치됨) 이상이 딸려온다.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
tiny_http = "0.12"
base64 = "0.22"
url = "2"
tokio = { version = "1", features = ["sync", "rt"] }
sha2 = "0.10"
rayon = "1"
libc = "0.2"
dunce = "1"
# 자율업무 Cron 모드 — 표준 5필드(분 시 일 월 요일) 전용 파서.
# 이 저장소의 첫 Cargo 의존성 추가라 "가볍고 감사 가능"을 선정 기준으로 삼았다:
# 전이 의존성 0개(cargo add 실측 — 잠금에 추가되는 패키지가 자기 자신 1개뿐),
# lib.rs 단일 파일 520줄, unsafe·build.rs·proc-macro 없음, chrono 피처도 넓히지
# 않는다. `parse::<TZ: TimeZone>(&str, &DateTime<TZ>) -> Result<DateTime<TZ>, ParseError>`
# 라서 schedule.rs의 `Tz: TimeZone` 제네릭 관례를 그대로 잇는다(설계 §5.2).
# 매시간(Hourly) 모드는 이 크레이트를 쓰지 않는다 — chrono만으로 계산한다(설계 §4).
# 정확 버전 고정(캐럿이 아닌 `=`): 0.9.0 이전에 "필드 5개 미만 입력 시 panic"
# 이력이 있었고(0.9.0에서 수정), 이 앱은 `panic = "abort"`라 회귀 시 앱 전체가
# 죽는다. 0.11.2는 다운로드 수가 적어 상대적으로 덜 굴러본 버전이므로 자동
# 마이너 업데이트를 받지 않는다(보안 검토 조건 4).
cron-parser = "=0.11.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# `process_util::pid_alive`(Windows 분기 — OpenProcess+GetExitCodeProcess)
# 전용. 신규 다운로드가 아니다 — `windows 0.61.3`는 tao/webview2-com 등을 통해
# 이미 Cargo.lock에 고정돼 있다(`cargo tree -i windows@0.61.3` 실측: tao,
# tauri, tauri-runtime, webview2-com, wry 등 6개 상위 크레이트가 이미 물고
# 있음). 여기서는 우리가 쓰는 `Win32_Foundation`/`Win32_System_Threading`
# 피처만 추가로 켠다 — 각 크레이트가 자신이 쓰는 피처만 독립적으로 선언해야
# 하므로(피처는 유니온되지만 선언 자체는 각자 몫) 우리 코드가 직접 쓰려면
# 우리 Cargo.toml에도 명시가 필요하다. `cfg(windows)` 타깃 전용이라 macOS
# 빌드에는 전혀 관여하지 않는다.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 사용량 통계가 jsonl 수백~수천 개를 파싱하는 CPU 바운드 작업이라 dev(디버그)
# 빌드에서 유독 느리다(release 대비 ~3.5배). 우리 크레이트 자체는 최적화하지
# 않아 증분 컴파일은 그대로 빠르게 유지하고, 실제 핫루프를 도는 의존성
# (serde_json 등)만 최적화한다.
[profile.dev.package."*"]
opt-level = 3
