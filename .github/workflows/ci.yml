# 가벼운 push/PR 상시 CI — 프런트엔드(타입체크+빌드) + Rust 컴파일·테스트를 검사한다.
#
# 잡 구성:
#   - frontend-check(ubuntu-latest): tsc + vite build.
#   - rust-test(windows-latest, macos-latest): `cargo test --manifest-path src-tauri/Cargo.toml`.
#     ubuntu에서는 Rust를 돌리지 않는다 — Tauri는 Linux 타깃에서 webkit2gtk 시스템
#     라이브러리가 필요한데 이 프로젝트의 배포 타깃은 macOS/Windows뿐이라(Linux
#     미지원) 그 의존성을 설치해 검사할 대상이 없다.
#   - 이 저장소는 public이라 macOS/Windows 호스티드 러너의 분(minutes)이 무료다
#     (`gh repo view --json visibility`로 확인 가능). 그래서 매 push/PR마다 두 OS에서
#     `cargo test`를 돌려도 금전 비용이 없고, 경로 필터로 트리거를 좁히지 않고
#     frontend-check와 같은 트리거를 그대로 공유한다.
#   - `#[cfg(windows)]`/`#[cfg(target_os = "macos")]`로 분기된 코드는 해당 OS에서
#     실제로 컴파일되지 않으면 검증된 적 없는 코드로 남는다 — 이 잡이 그 컴파일
#     자체를 보증한다. `tauri-portable-build.yml`은 릴리스 프로필로 프로덕션
#     아티팩트를 만들 뿐 테스트를 돌리지 않으므로(`--no-bundle`/`--bundles app`은
#     빌드이지 테스트가 아니다) 이 잡을 대신하지 못한다.
#
# 보안 원칙(기존 워크플로에서 계승):
#   - 액션은 sha로 고정한다(가변 태그 `@v4` 금지).
#   - `permissions`는 최소(`contents: read`)로 둔다.
#   - 시크릿을 쓰지 않는다(`GOOGLE_OAUTH_CLIENT_SECRET`은 build.rs가
#     `option_env!()`로 선택적으로 읽고 없어도 컴파일·테스트가 통과하므로, 이
#     잡에는 주입하지 않는다).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Frontend build (vite)
        run: pnpm build

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09 pin)
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # frontendDist("../dist")가 없어도 `cargo test`는 통과한다(로컬에서 dist를
      # 비운 상태로 실측 확인) — tauri_build::build()가 build.rs 시점에 프런트엔드
      # 산출물 존재를 요구하지 않는다. 그래서 pnpm/Node 셋업 없이 Rust만으로 잡을
      # 구성한다(러너 시간 절약).
      - name: cargo test (debug profile)
        run: cargo test --manifest-path src-tauri/Cargo.toml
