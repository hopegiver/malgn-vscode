# 포터블(설치 프로그램 아님) Tauri 빌드 — macOS/Windows 아티팩트를 수동으로 뽑아낸다.
#
# 무엇을 왜 이렇게 뽑는가:
#   - macOS: `--bundles app`으로 dmg 없이 `.app` 번들만 만든다. `.app` 자체가
#     "복사해서 바로 실행" 가능한 포터블 형태라 dmg 설치 과정이 필요 없다.
#     (플랫폼별 타깃 제한은 src-tauri/tauri.macos.conf.json에 고정돼 있어 이 플래그는
#     방어적 중복이다 — 둘 다 app만 만들도록 맞춰져 있다.)
#   - Windows: `--no-bundle`로 NSIS/MSI 설치 프로그램 생성 자체를 건너뛰고,
#     `cargo build`가 만든 원본 실행 파일(target/release/*.exe)만 그대로 올린다.
#     WebView2는 최신 Windows 10/11에 기본 포함이라 별도 런타임 번들링을 하지 않는다
#     — 오래된 Windows나 WebView2가 제거된 환경이면 실행 시 WebView2 설치가 필요할 수
#     있다.
#   - macOS 산출물은 코드서명/공증(notarization)을 하지 않는다. Gatekeeper가
#     "확인되지 않은 개발자" 경고를 띄우므로 받은 사람은 우클릭 → 열기로 처음 한 번
#     예외 처리해야 한다. 서명/공증은 이번 범위가 아니다(사내 목업 단계, 별도 결정 필요).
#
# 트리거: workflow_dispatch(항상 가능) + main push(빌드에 영향 주는 경로만).
#   - 활발히 개발 중이라 main push가 잦다 — 문서/설정만 바뀐 push까지 무거운
#     macOS+Windows 매트릭스를 매번 돌리면 낭비이므로 `paths`로 실제 빌드 입력
#     (프런트엔드 소스, Rust 소스, 매니페스트, 이 워크플로 자체)만 걸렀다.
#   - 연속 push가 몰릴 때 이전 커밋의 빌드가 아직 안 끝났으면 `concurrency`로
#     취소한다 — 어차피 최신 커밋 결과만 보면 되고, macOS/Windows 러너 분당 비용이
#     Linux보다 훨씬 비싸다.
#
# 보안 원칙(기존 워크플로에서 계승):
#   - 액션은 sha로 고정한다(가변 태그 `@v4` 금지).
#   - `permissions`는 최소(`contents: read`)로 둔다.
#   - 코드서명 시크릿은 쓰지 않는다(서명 없음 = 서명 시크릿도 없음). 유일한 예외는
#     GOOGLE_OAUTH_CLIENT_SECRET — 앱 소스에 리터럴로 두지 않으려고(이 저장소는
#     public) repo secret으로 등록해 빌드 시점에만 env로 주입한다. 로그에 값이
#     찍히지 않도록 `echo`/`run` 블록에서 직접 참조하지 않고, job 레벨 env로만
#     노출한다(GitHub Actions가 시크릿 값을 로그에서 자동 마스킹하기도 한다).
name: tauri-portable-build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri-portable-build.yml'

concurrency:
  group: tauri-portable-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09 pin)
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # macOS: .app 번들만 빌드(dmg 생략) 후 ditto로 zip. plain `zip`이 아니라
      # `ditto`를 쓰는 이유는 .app 번들의 리소스 포크/확장 속성을 안전하게 보존하는
      # Apple 권장 방식이기 때문이다.
      - name: Build (macOS, .app only)
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app

      - name: Zip .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::.app bundle not found under src-tauri/target/release/bundle/macos"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/malgn-agent-macos-app.zip"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: malgn-agent-macos-app
          path: ${{ runner.temp }}/malgn-agent-macos-app.zip
          if-no-files-found: error

      # Windows: 번들링(설치 프로그램 생성) 자체를 건너뛰고 cargo가 만든 원본 exe만 쓴다.
      - name: Build (Windows, no installer)
        if: runner.os == 'Windows'
        run: pnpm tauri build --no-bundle

      - name: Locate raw exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXE_PATH=$(find src-tauri/target/release -maxdepth 1 -name "*.exe" | head -n1)
          if [ -z "$EXE_PATH" ]; then
            echo "::error::no .exe found under src-tauri/target/release"
            exit 1
          fi
          echo "Found exe: $EXE_PATH"
          mkdir -p "$RUNNER_TEMP/malgn-agent-windows"
          cp "$EXE_PATH" "$RUNNER_TEMP/malgn-agent-windows/"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: malgn-agent-windows-exe
          path: ${{ runner.temp }}/malgn-agent-windows/*.exe
          if-no-files-found: error
