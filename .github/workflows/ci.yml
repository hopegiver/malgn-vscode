# 가벼운 push/PR 상시 CI — 프런트엔드(타입체크+빌드) + Rust 컴파일·테스트를 검사한다.
#
# 잡 구성:
#   - frontend-check(ubuntu-latest): tsc + vite build.
#   - rust-test(windows-latest, macos-latest): `cargo test --manifest-path src-tauri/Cargo.toml`.
#     ubuntu에서는 Rust를 돌리지 않는다 — Tauri는 Linux 타깃에서 webkit2gtk 시스템
#     라이브러리가 필요한데 이 프로젝트의 배포 타깃은 macOS/Windows뿐이라(Linux
#     미지원) 그 의존성을 설치해 검사할 대상이 없다.
#   - 이 저장소는 public이라 macOS/Windows 호스티드 러너의 분(minutes)이 무료다
#     (`gh repo view --json visibility`로 확인 가능). 그래서 매 push/PR마다 두 OS에서
#     `cargo test`를 돌려도 금전 비용이 없고, 경로 필터로 트리거를 좁히지 않고
#     frontend-check와 같은 트리거를 그대로 공유한다.
#   - `#[cfg(windows)]`/`#[cfg(target_os = "macos")]`로 분기된 코드는 해당 OS에서
#     실제로 컴파일되지 않으면 검증된 적 없는 코드로 남는다 — 이 잡이 그 컴파일
#     자체를 보증한다. `tauri-portable-build.yml`은 릴리스 프로필로 프로덕션
#     아티팩트를 만들 뿐 테스트를 돌리지 않으므로(`--no-bundle`/`--bundles app`은
#     빌드이지 테스트가 아니다) 이 잡을 대신하지 못한다.
#   - `cargo test`(플래그 없음)는 `#[ignore]`가 붙은 테스트를 자동으로 건너뛴다
#     (조용한 스킵이 아니다 — 출력의 "N ignored"로 항상 드러난다). 이 저장소의
#     `#[ignore]` 테스트는 전부 "이 개발자 머신의 실제 상태"(설치된 도구, 실사용
#     로그, ~/workspace의 이 프로젝트 등)에 의존해 CI 러너에는 원천적으로
#     재현 불가능한 전제를 검증하며, 각 테스트 바로 위 주석에 로컬 실행법
#     (`cargo test -- --ignored <경로>`)이 있다. `#[cfg(target_os = "macos")]`/
#     `#[cfg(not(windows))]`/`#[cfg(unix)]`로 게이팅된 테스트는 그 함수 이름이
#     증언하는 플랫폼 전제(예: "이 머신은 Mac이다") 때문에 다른 OS에서는
#     컴파일조차 하지 않는다 — 로컬 macOS `cargo test`에서는 평소처럼 돈다.
#
# 보안 원칙(기존 워크플로에서 계승):
#   - 액션은 sha로 고정한다(가변 태그 `@v4` 금지).
#   - `permissions`는 최소(`contents: read`)로 둔다.
#   - 시크릿을 쓰지 않는다(`GOOGLE_OAUTH_CLIENT_SECRET`은 build.rs가
#     `option_env!()`로 선택적으로 읽고 없어도 컴파일·테스트가 통과하므로, 이
#     잡에는 주입하지 않는다).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Frontend build (vite)
        run: pnpm build

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09 pin)
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # frontendDist("../dist")가 없어도 `cargo test`는 통과한다(로컬에서 dist를
      # 비운 상태로 실측 확인) — tauri_build::build()가 build.rs 시점에 프런트엔드
      # 산출물 존재를 요구하지 않는다. 그래서 pnpm/Node 셋업 없이 Rust만으로 잡을
      # 구성한다(러너 시간 절약).
      - name: cargo test (debug profile)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # dev_auto_login.rs의 릴리스 배제 불변식(`dev_auto_login()`이 항상 None을
      # 반환)을 검증하는 단언은 release 프로필에서만 컴파일된다
      # (`command_matches_compile_time_configuration`의 `#[cfg(not(debug_assertions))]`
      # 분기) — debug 프로필로만 도는 위 스텝만으로는 그 단언이 영원히
      # 실행되지 않는다. 이 스텝이 그 컴파일·실행을 실제로 보증한다.
      #
      # ⚠️ `DEV_AUTO_LOGIN_EMAIL`은 절대 이 워크플로의 secret이나 `env:` 블록에
      # 넣지 말 것 — 로컬 개발 전용 우회 값이고, 여기 넣는 순간 CI 러너 환경에
      # 그 값이 존재하게 되어 `dev_auto_login.rs`/`build.rs`의 게이트 논의와
      # 무관하게 이 저장소의 보안 전제 자체가 깨진다.
      - name: cargo test (release profile)
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      # Windows 실기 PC 테스트 생략의 대체 증거: dev-tools 탐지/설치경로 로직을
      # windows-latest/macos-latest 러너에서 실제로 실행해 DevToolStatus
      # (installed/version/path/install_method/action_kind) 전체를 로그에 남긴다.
      # `--ignored`에 이름 필터(dump_dev_tool_status_for_ci_evidence)를 함께 주면
      # 그 이름을 포함하는 ignore 테스트만 실행된다 — 머신 의존 전제를 가진 다른
      # 16건의 #[ignore] 테스트(예: finds_this_project_in_workspace)는 이름이
      # 일치하지 않으므로 계속 건너뛴다. 로컬에서 기존 ignore 테스트 이름 하나로
      # 같은 필터를 실측한 결과 정확히 1건만 실행되고 나머지는 "filtered out"으로
      # 빠지는 것을 확인했다(동일 필터 메커니즘이므로 이 신규 테스트에도 동일하게
      # 적용된다). `--nocapture`로 표준출력을 그대로 노출하며, 이 스텝은
      # `continue-on-error`를 쓰지 않아 실패 시 잡을 실패시킨다. 위 `cargo test`
      # 스텝과 같은 `src-tauri -> target` 캐시를 재사용하므로 추가 컴파일 비용은
      # 증분 빌드 수준이다. 출력이 짧고 단일 스텝 로그로 충분히 읽히므로 별도
      # 아티팩트 업로드는 추가하지 않는다(복잡도 대비 이득이 없음).
      #
      # `shell: bash`를 명시한다 — windows-latest의 기본 셸은 pwsh라 `\` 줄바꿈
      # 연속 문자(bash 관례)가 단항 연산자 뒤 문장 종료로 오파싱되어 `--ignored`가
      # ParserError를 냈다(run 35057848027). GitHub 호스티드 windows-latest에는
      # Git for Windows의 bash가 기본 내장되어 있어 `shell: bash` 지정만으로 두
      # OS에서 동일한 스크립트가 해석된다. 이 지정은 이 스텝에만 적용되며 잡의
      # 다른 `run:` 스텝(`cargo test (debug profile)`)은 여전히 OS 기본 셸을 그대로
      # 쓴다 — 이미 통과하던 스텝의 셸을 바꿔 새 위험을 얹지 않기 위함이다.
      # 잡 전체에 `defaults.run.shell: bash`를 거는 방식도 검토했으나, 이미 초록인
      # `cargo test (debug profile)` 스텝까지 굳이 셸을 바꿔 불필요한 회귀 위험을
      # 추가하므로 배제했다.
      #
      # 이름 필터가 0건을 매칭하면 `cargo test`는 "0 passed; 0 failed"로 exit 0을
      # 반환해 조용히 통과한다(테스트 스위트가 우연히 비어도 초록으로 보이는 함정).
      # 이를 막기 위해 출력에서 정확히 "1 passed"를 grep으로 확인하고, 없으면 이
      # 스텝 자체를 실패시킨다 — 실패 시에도 cargo test의 원출력을 먼저 echo하여
      # 로그에서 원인을 바로 읽을 수 있게 한다.
      - name: cargo test -- dev-tools 탐지 증거 덤프 (ignored, evidence)
        shell: bash
        run: |
          set -uo pipefail
          output=$(cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --nocapture dump_dev_tool_status_for_ci_evidence 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test 실행 자체가 실패했습니다 (exit $status)"
            exit "$status"
          fi
          if ! grep -q "test result: ok\. 1 passed" <<< "$output"; then
            echo "::error::dump_dev_tool_status_for_ci_evidence 가 정확히 1건 매칭/통과하지 않았습니다 — 이름 필터 0건 매칭 시 조용히 통과하는 함정 방지"
            exit 1
          fi
