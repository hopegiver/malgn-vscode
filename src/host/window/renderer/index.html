<!DOCTYPE html>
<html lang="ko">
<head>

  <!-- 엄격 CSP — 인라인 스크립트/스타일이 전혀 없으므로 nonce 없이도 'self'만으로
       충분하다(architecture.md §2.8 "엄격 CSP + nonce"의 정신을 유지하되, 이 창은

</head>
