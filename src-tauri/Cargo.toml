[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify-debouncer-mini = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
tiny_http = "0.12"
base64 = "0.22"
url = "2"
tokio = { version = "1", features = ["sync", "rt"] }
sha2 = "0.10"
keyring = "4"
rayon = "1"
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 사용량 통계가 jsonl 수백~수천 개를 파싱하는 CPU 바운드 작업이라 dev(디버그)
# 빌드에서 유독 느리다(release 대비 ~3.5배). 우리 크레이트 자체는 최적화하지
# 않아 증분 컴파일은 그대로 빠르게 유지하고, 실제 핫루프를 도는 의존성
# (serde_json 등)만 최적화한다.
[profile.dev.package."*"]
opt-level = 3
